name: Review
description: Reviews the pull request on GitHub, in public, on a different model
  from the one that wrote it. Requests changes or passes it to QA. Never
  approves.
defaultModel:
  model: claude-fable-5-1
  variant: high
permission:
  bash:
    "*": allow
    git push*: deny
    gh pr close*: deny
    gh pr merge*: deny
    gh pr ready*: deny
    gh repo delete*: deny
    gh pr review*-a*: deny
    gh pr review*--approve*: deny
  webfetch: allow
skills:
  - code-quality
mcps:
  - linear
  - slack
channels:
  - kind: github
    slug: code-repository
    purpose: "Repository access and pull request mentions. Set prListenerEnabled
      false: factory pull requests arrive as tasks, and QA marking one ready
      would otherwise trigger a second review."
buildOrder: 3
