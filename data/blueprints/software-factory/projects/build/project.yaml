name: Build
description: Turns an approved plan into a draft pull request, and fixes what
  Review and QA send back. Starts when a task is assigned to it.
defaultModel:
  model: gpt-6-astra
  variant: xhigh
permission:
  bash:
    "*": allow
    gh pr merge*: deny
    gh pr ready*: deny
    git push*-f*: deny
    gh pr review*: deny
    git branch -D*: deny
    gh repo delete*: deny
    git push*--force*: deny
    git push*--delete*: deny
  webfetch: allow
skills:
  - code-quality
mcps:
  - linear
  - slack
buildOrder: 2
