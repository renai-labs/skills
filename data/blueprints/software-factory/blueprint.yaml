kind: pod
name: Software Factory
description: A Linear issue goes in. A reviewed PR, a tested build, and a docs
  page come out.
brandColor: "#0f172a"
categories:
  roles:
    - engineer
    - devops
    - product-manager
  usecases:
    - release-management
    - incident-response
  functions:
    - code-review
    - deployment
    - alerting
    - document-generation
    - summarization
  verticals:
    - engineering-factory
examplePrompts:
  - Here is a bug report from Slack. Triage it and draft a plan on the Linear
    issue.
  - Run the approved REN-123 plan through the belt. Prepare and assign its Build
    task.
  - What did the factory learn this week? Read the memory store and summarise.
pod:
  name: Software Factory
  description: "Six stations: Issues, Build, Review, QA, Docs, Monitoring. Linear
    holds the work record. Assigning prepared tasks starts agents in the
    receiving project context."
  defaultModel:
    model: claude-opus-5
    variant: null
  environment:
    preset: xl
