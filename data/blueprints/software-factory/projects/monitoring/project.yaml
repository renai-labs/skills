name: Monitoring
description: "Runs the factory's scheduled work: watching what recent releases
  did to production, keeping the docs in step with what shipped, and
  consolidating what the factory learned."
defaultModel:
  model: claude-opus-5
  variant: null
permission:
  bash:
    "*": allow
    gh pr merge*: deny
    git push*-f*: deny
    gh pr review*: deny
    git branch -D*: deny
    gh repo delete*: deny
    git push*--force*: deny
  webfetch: allow
skills:
  - release-monitoring
  - docs-maintenance
  - agent-dreaming
mcps:
  - posthog
  - context7
  - linear
  - slack
triggers:
  - slug: release-monitoring
    schedule: 0 */3 * * *
    inputMessage: "Check what the last 24 hours of merges did to production. Follow
      the release-monitoring skill: read what merged, work out what those
      changes could plausibly affect, and look at the telemetry that would show
      it. You are looking for effects nobody would have reported, like a slow
      query, a cost or latency change, a funnel that quietly dropped, or a
      resource that keeps growing. Explicit errors already reach the team
      through their own alerting, so do not repeat them. If you find something
      worth acting on, post it in the engineering channel with the evidence and
      what you think caused it. If nothing moved, finish without posting."
  - slug: docs-maintenance
    schedule: 0 4 * * *
    inputMessage: "Bring the documentation up to date with what merged yesterday.
      Follow the docs-maintenance skill: read the merges, find the documentation
      in the repository that is now wrong or missing, and fix it using whatever
      docs setup the repository already has. Update the existing open Ren
      documentation pull request for each repository if there is one, otherwise
      open one, and say in the engineering channel what changed. If nothing that
      merged affects the docs, finish quietly."
  - slug: memory-consolidation
    schedule: 0 4 * * *
    inputMessage: "Consolidate what the factory learned yesterday. Follow the
      agent-dreaming skill: read yesterday's sessions across the projects in
      this pod, keep the corrections people made, the product rules, and the
      engineering traps that will matter again, and write them into the shared
      memory store. Merge duplicates, and retire anything the code or the team
      has since contradicted. Keep it short enough that the other projects can
      read it before every run."
buildOrder: 5
